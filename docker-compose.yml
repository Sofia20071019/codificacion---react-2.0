version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Base de datos MySQL
  # -------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --lower_case_table_names=1

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Kimuka3_db
      MYSQL_USER: kimuka
      MYSQL_PASSWORD: kimuka123

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./3_0_API/schema_kimuka3.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot123"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Backend Flask (API)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./3_0_API

    restart: unless-stopped

    environment:
      SECRET_KEY: kimuka-jwt-secret-key-titan-sports-2026
      MYSQL_USER: kimuka
      MYSQL_PASSWORD: kimuka123
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: Kimuka3_db

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Frontend React + Vite
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: "./config tu"

    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - "./config tu:/app"
      - /app/node_modules

# -------------------------------------------------------------------------
# Volúmenes
# -------------------------------------------------------------------------
volumes:
  db_data: