version: "3.9"

services:

  # -------------------------------------------------------------------------
  # Base de datos MySQL
  # -------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Este script se ejecuta SOLO la primera vez que se crea el volumen,
      # creando las tablas automáticamente a partir de tu schema.
      - ./3_0_API/schema_kimuka3.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Backend Flask (API)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./3_0_API
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Frontend React + Vite
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: "./config tu"
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Evita que node_modules del contenedor se pisen con los del host
    volumes:
      - "./config tu:/app"
      - /app/node_modules

volumes:
  db_data:
